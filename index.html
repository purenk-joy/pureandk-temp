<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PURE&K | Website Renewal</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #fff;
    }
    body {
      overflow: hidden;
    }
    .page {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
    }
    .page img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }
    @media (max-width: 768px) {
      .page img {
        object-fit: contain;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <img src="coming-soon.png" alt="PURE&K Website Renewal in Progress">
  </main>
</body>
</html>
